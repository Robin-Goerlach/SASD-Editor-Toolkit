name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SASD-Editor-Toolkit.sln
      - name: Build
        run: dotnet build SASD-Editor-Toolkit.sln --configuration Debug --no-restore
      - name: Test
        run: dotnet test SASD-Editor-Toolkit.sln --configuration Debug --no-build --logger trx
